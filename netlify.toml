[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  # This project uses Vinext's static export. Netlify's UI detected the Next.js
  # dependency and added its runtime plugin, which must not process this build.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# The application is a single static route today. This preserves navigation if
# a workshop link is shared with a trailing path in a future iteration.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
